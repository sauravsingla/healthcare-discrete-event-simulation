name: remaining-tests

on:
  push:
    branches: [validation/full-e2e-20260730]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test:
          - tests/test_advanced_corrections.py::test_capacity_reduction_never_creates_negative_or_excess_tokens
          - tests/test_advanced_corrections.py::test_failures_interrupt_and_repair_scans_without_losing_patient_accounting
          - tests/test_advanced_model.py::test_machine_failures_are_recorded
          - tests/test_advanced_model.py::test_paper_registry_runs_all_eleven_scenarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run targeted remaining test
        run: pytest -vv --tb=long "${{ matrix.test }}"
