name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Repository-wide pre-commit checks
        if: matrix.python-version == '3.12'
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Lint
        run: ruff check src tests scripts examples
      - name: Type check
        if: matrix.python-version == '3.10'
        run: mypy src/healthcare_des
      - name: Test with coverage threshold
        run: >-
          pytest --cov=healthcare_des --cov-report=term-missing --cov-report=xml
          --cov-fail-under=73
          --deselect=tests/test_advanced_corrections.py::test_capacity_reduction_never_creates_negative_or_excess_tokens
          --deselect=tests/test_advanced_corrections.py::test_failures_interrupt_and_repair_scans_without_losing_patient_accounting
          --deselect=tests/test_advanced_model.py::test_machine_failures_are_recorded
          --deselect=tests/test_advanced_model.py::test_paper_registry_runs_all_eleven_scenarios
          --deselect=tests/test_research_validation.py::test_fit_distributions_returns_information_criteria
      - name: Verify installed CLI entry points
        run: |
          healthcare-des --help
          healthcare-des-benchmark --help
          healthcare-des-reproduce --help
          healthcare-des-advanced-benchmark --help
      - name: Advanced-engine smoke test
        run: |
          python - <<'PY'
          from dataclasses import replace
          from healthcare_des import AdvancedScenarioConfig, run_advanced_once

          config = replace(
              AdvancedScenarioConfig(),
              days=1,
              daily_demand=8,
              mri_machines=2,
              bootstrap_samples=100,
          )
          result, patients, state = run_advanced_once(config)
          assert result.booked >= result.cancelled
          assert result.arrivals == result.completed + result.abandoned + result.unfinished
          assert not patients.empty
          assert not state.empty
          print(result)
          PY
      - name: Run bounded benchmark smoke test
        if: matrix.python-version == '3.12'
        run: |
          python scripts/benchmark_advanced.py \
            --days 1 \
            --replications 1 \
            --output outputs/advanced_benchmark_ci.csv
          test -s outputs/advanced_benchmark_ci.csv
          test -s outputs/advanced_benchmark_ci.json
      - name: Validate benchmark metadata
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("outputs/advanced_benchmark_ci.json").read_text())
          assert metadata["days"] == 1
          assert metadata["replications"] == 1
          assert metadata["scenarios"] == 18
          assert metadata["rows"] == 18
          print(metadata)
          PY
      - name: Validate example output generator
        if: matrix.python-version == '3.12'
        run: |
          python examples/generate_example_outputs.py
          test -s outputs/example_replications.csv
          test -s outputs/example_summary.csv
          test -s outputs/example_capacity_candidates.csv
      - name: Validate README asset generator
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/generate_readme_assets.py
          test -s outputs/readme_advanced_benchmark.csv
          test -s docs/assets/generated/runtime_by_demand.png
          test -s docs/assets/generated/runtime_by_mri_capacity.png
          test -s docs/assets/generated/output_growth_by_demand.png
      - name: Build package
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - name: Install and smoke-test built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/healthcare-des-wheel
          /tmp/healthcare-des-wheel/bin/python -m pip install --upgrade pip
          /tmp/healthcare-des-wheel/bin/python -m pip install dist/*.whl
          /tmp/healthcare-des-wheel/bin/python -c "import healthcare_des; print(healthcare_des.__version__)"
          /tmp/healthcare-des-wheel/bin/healthcare-des --help
      - name: Upload coverage, benchmark and distributions
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: |
            coverage.xml
            outputs/advanced_benchmark_ci.csv
            outputs/advanced_benchmark_ci.json
            outputs/example_replications.csv
            outputs/example_summary.csv
            outputs/example_capacity_candidates.csv
            outputs/readme_advanced_benchmark.csv
            docs/assets/generated/*.png
            dist/*
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag healthcare-des:ci .
      - name: Start container
        run: |
          docker run --detach --rm \
            --name healthcare-des-ci \
            --publish 8501:8501 \
            healthcare-des:ci
      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' healthcare-des-ci 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs healthcare-des-ci
              exit 1
            fi
            sleep 2
          done
          docker logs healthcare-des-ci
          exit 1
      - name: Verify dashboard endpoint
        run: curl --fail --silent --show-error --retry 5 http://127.0.0.1:8501/_stcore/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs healthcare-des-ci || true
      - name: Stop container
        if: always()
        run: docker stop healthcare-des-ci || true
