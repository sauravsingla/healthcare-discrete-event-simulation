name: ci

on:
  pull_request:
  push:
    branches: [fix/issue-10-dynamic-capacity]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ci: apply issue 10 follow-up fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-10-dynamic-capacity
      - name: Rebalance before state snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/healthcare_des/advanced_engine.py')
          text = path.read_text()
          old = '''    def _track_state(self):
        while True:
            minute = int(self.env.now % 1440)
            self.state.append(
'''
          new = '''    def _track_state(self):
        while True:
            yield self.env.process(self.clerks.rebalance())
            yield self.env.process(self.radiographers.rebalance())
            yield self.env.process(self.radiologists.rebalance())
            minute = int(self.env.now % 1440)
            self.state.append(
'''
          if old not in text:
              raise SystemExit('state tracker block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit follow-up fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/healthcare_des/advanced_engine.py
          git commit -m 'fix: rebalance dynamic capacity before state snapshots'
          git push origin HEAD:fix/issue-10-dynamic-capacity

  targeted-tests:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'fix: rebalance dynamic capacity before state snapshots'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts examples
      - run: pytest -q tests/test_advanced_corrections.py::test_capacity_reduction_never_creates_negative_or_excess_tokens
