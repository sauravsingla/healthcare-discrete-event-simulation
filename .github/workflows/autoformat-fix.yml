name: autoformat-fix

on:
  push:
    branches: [fix/baseline-quality-gate]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-quality-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Apply repository quality fixes
        run: |
          ruff check src tests scripts examples --fix
          ruff format src tests scripts examples
          pre-commit run end-of-file-fixer --all-files || true
          pre-commit run trailing-whitespace --all-files || true
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply automated quality fixes"
          git push
