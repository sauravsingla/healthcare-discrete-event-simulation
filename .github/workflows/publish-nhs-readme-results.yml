name: Publish NHS README results

on:
  push:
    branches:
      - docs/publish-nhs-benchmark-results
    paths:
      - "docs/benchmarks/nhs/2026-08-02/**"
      - "scripts/publish_nhs_results_to_readme.py"
      - ".github/workflows/publish-nhs-readme-results.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: docs/publish-nhs-benchmark-results

      - name: Publish retained results into README
        run: python scripts/publish_nhs_results_to_readme.py

      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: publish NHS external benchmark numbers in README"
          git push origin HEAD:docs/publish-nhs-benchmark-results
