name: issue-10-patcher

on:
  pull_request:
    branches: [fix/baseline-quality-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/issue-10-dynamic-capacity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-10-dynamic-capacity
      - name: Apply focused dynamic-capacity fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/healthcare_des/advanced_engine.py')
          text = path.read_text()
          text = text.replace(
              '        self.maximum = max(default_capacity, *(window.capacity for window in windows), 1)\n'
              '        self.tokens = simpy.Container(env, capacity=self.maximum, init=default_capacity)\n'
              '        self.busy = 0\n',
              '        self.maximum = max(default_capacity, *(window.capacity for window in windows), 1)\n'
              '        initial_capacity = self.target(int(env.now % 1440))\n'
              '        self.tokens = simpy.Container(env, capacity=self.maximum, init=initial_capacity)\n'
              '        self.busy = 0\n',
          )
          text = text.replace(
              '    def release(self):\n'
              '        self.busy -= 1\n'
              '        if self.busy < 0:\n'
              '            raise RuntimeError("dynamic capacity busy count became negative")\n'
              '        yield self.env.process(self.rebalance())\n',
              '    def release(self):\n'
              '        if self.busy <= 0:\n'
              '            raise RuntimeError("dynamic capacity busy count became negative")\n'
              '        self.busy -= 1\n'
              '        yield self.env.process(self.rebalance())\n',
          )
          text = text.replace(
              '        token = capacity.tokens.get(1)\n'
              '        timeout = self.env.timeout(self._remaining_patience(deadline))\n'
              '        outcome = yield token | timeout\n'
              '        if token not in outcome:\n'
              '            token.cancel()\n'
              '            return None\n'
              '        capacity.busy += 1\n'
              '        yield self.env.process(capacity.rebalance())\n',
              '        token = capacity.tokens.get(1)\n'
              '        acquired = False\n'
              '        def mark_acquired(_event):\n'
              '            nonlocal acquired\n'
              '            acquired = True\n'
              '            capacity.busy += 1\n'
              '        token.callbacks.append(mark_acquired)\n'
              '        timeout = self.env.timeout(self._remaining_patience(deadline))\n'
              '        outcome = yield token | timeout\n'
              '        if token not in outcome:\n'
              '            if acquired:\n'
              '                yield self.env.process(capacity.release())\n'
              '            else:\n'
              '                token.cancel()\n'
              '            return None\n'
              '        yield self.env.process(capacity.rebalance())\n',
          )
          path.write_text(text)
          PY
      - name: Remove temporary branch workflow
        run: rm -f .github/workflows/apply-issue-10-fix.yml
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/healthcare_des/advanced_engine.py .github/workflows/apply-issue-10-fix.yml
          git commit -m 'fix: make dynamic capacity accounting atomic'
          git push origin HEAD:fix/issue-10-dynamic-capacity
