name: Apply README interpretation

on:
  push:
    branches:
      - docs/publish-nhs-benchmark-results
    paths:
      - .github/workflows/apply-readme-interpretation.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/publish-nhs-benchmark-results
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add easy interpretation and remove temporary automation
        run: |
          python scripts/add_easy_nhs_interpretation.py
          rm scripts/add_easy_nhs_interpretation.py
          rm .github/workflows/apply-readme-interpretation.yml
      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/add_easy_nhs_interpretation.py .github/workflows/apply-readme-interpretation.yml
          git commit -m "docs: explain NHS benchmark results in plain language"
          git push origin HEAD:docs/publish-nhs-benchmark-results
