name: apply-issue-10-fix

on:
  push:
    branches: [fix/issue-10-dynamic-capacity]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: make dynamic capacity accounting atomic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-10-dynamic-capacity
      - name: Patch accounting transitions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/healthcare_des/advanced_engine.py')
          text = path.read_text()
          text = text.replace(
              'self.tokens = simpy.Container(env, capacity=self.maximum, init=default_capacity)',
              'self.tokens = simpy.Container(env, capacity=self.maximum, init=self.target(0))',
          )
          text = text.replace(
              '''    def release(self):
        self.busy -= 1
        if self.busy < 0:
            raise RuntimeError("dynamic capacity busy count became negative")
        yield self.env.process(self.rebalance())
''',
              '''    def release(self):
        if self.busy <= 0:
            raise RuntimeError("dynamic capacity busy count became negative")
        new_busy = self.busy - 1
        desired = max(0, self.target(int(self.env.now % 1440)) - new_busy)
        current = int(self.tokens.level)
        if desired > current:
            yield self.tokens.put(desired - current)
        self.busy = new_busy
        yield self.env.process(self.rebalance())
''',
          )
          text = text.replace(
              '''        outcome = yield token | timeout
        if token not in outcome:
            token.cancel()
            return None
        capacity.busy += 1
        yield self.env.process(capacity.rebalance())
''',
              '''        def mark_busy(event):
            if event.ok:
                capacity.busy += 1

        token.callbacks.append(mark_busy)
        outcome = yield token | timeout
        if token not in outcome:
            token.cancel()
            return None
        yield self.env.process(capacity.rebalance())
''',
          )
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/healthcare_des/advanced_engine.py
          git commit -m 'fix: make dynamic capacity accounting atomic'
          git push origin HEAD:fix/issue-10-dynamic-capacity
