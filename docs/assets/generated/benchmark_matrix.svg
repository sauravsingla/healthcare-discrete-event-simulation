<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
<title id="title">Advanced engine benchmark scenario matrix</title>
<desc id="desc">Eighteen scenarios combining three daily demand levels and six MRI capacity levels, with two replications per scenario.</desc>
<rect width="920" height="430" rx="18" fill="#ffffff"/>
<rect x="1" y="1" width="918" height="428" rx="18" fill="none" stroke="#d0d7de"/>
<text x="460" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">Benchmark Scenario Matrix</text>
<text x="460" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#57606a">3 demand levels × 6 MRI capacities × 2 replications = 36 measured runs</text>
<text x="165" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">Daily demand</text>
<text x="550" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#24292f">MRI machines</text>
<g font-family="Arial, sans-serif" font-size="14" fill="#24292f" text-anchor="middle">
<text x="325" y="130">1</text><text x="415" y="130">2</text><text x="505" y="130">4</text><text x="595" y="130">8</text><text x="685" y="130">12</text><text x="775" y="130">20</text>
<text x="165" y="185">35 patients/day</text><text x="165" y="255">70 patients/day</text><text x="165" y="325">140 patients/day</text>
</g>
<g fill="#ddf4ff" stroke="#54aeff">
<rect x="285" y="150" width="80" height="50" rx="8"/><rect x="375" y="150" width="80" height="50" rx="8"/><rect x="465" y="150" width="80" height="50" rx="8"/><rect x="555" y="150" width="80" height="50" rx="8"/><rect x="645" y="150" width="80" height="50" rx="8"/><rect x="735" y="150" width="80" height="50" rx="8"/>
</g>
<g fill="#dafbe1" stroke="#4ac26b">
<rect x="285" y="220" width="80" height="50" rx="8"/><rect x="375" y="220" width="80" height="50" rx="8"/><rect x="465" y="220" width="80" height="50" rx="8"/><rect x="555" y="220" width="80" height="50" rx="8"/><rect x="645" y="220" width="80" height="50" rx="8"/><rect x="735" y="220" width="80" height="50" rx="8"/>
</g>
<g fill="#fff8c5" stroke="#d4a72c">
<rect x="285" y="290" width="80" height="50" rx="8"/><rect x="375" y="290" width="80" height="50" rx="8"/><rect x="465" y="290" width="80" height="50" rx="8"/><rect x="555" y="290" width="80" height="50" rx="8"/><rect x="645" y="290" width="80" height="50" rx="8"/><rect x="735" y="290" width="80" height="50" rx="8"/>
</g>
<g font-family="Arial, sans-serif" font-size="13" fill="#24292f" text-anchor="middle">
<text x="325" y="180">2 runs</text><text x="415" y="180">2 runs</text><text x="505" y="180">2 runs</text><text x="595" y="180">2 runs</text><text x="685" y="180">2 runs</text><text x="775" y="180">2 runs</text>
<text x="325" y="250">2 runs</text><text x="415" y="250">2 runs</text><text x="505" y="250">2 runs</text><text x="595" y="250">2 runs</text><text x="685" y="250">2 runs</text><text x="775" y="250">2 runs</text>
<text x="325" y="320">2 runs</text><text x="415" y="320">2 runs</text><text x="505" y="320">2 runs</text><text x="595" y="320">2 runs</text><text x="685" y="320">2 runs</text><text x="775" y="320">2 runs</text>
</g>
<rect x="120" y="365" width="680" height="38" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Each run uses a 2-day horizon, seed 17 and 100 bootstrap samples</text>
</svg>
