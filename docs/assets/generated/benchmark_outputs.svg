<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
<title id="title">Benchmark outputs and validation checks</title>
<desc id="desc">The benchmark records elapsed runtime, patient ledger rows and state observation rows, while checking lifecycle reconciliation.</desc>
<rect width="920" height="330" rx="18" fill="#ffffff"/>
<rect x="1" y="1" width="918" height="328" rx="18" fill="none" stroke="#d0d7de"/>
<text x="460" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">Benchmark Outputs and Checks</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="55" y="90" width="235" height="105" rx="14" fill="#ddf4ff" stroke="#54aeff"/>
<text x="172" y="125" font-size="17" font-weight="700" fill="#24292f">Runtime diagnostic</text>
<text x="172" y="153" font-size="14" fill="#57606a">elapsed_seconds</text>
<text x="172" y="177" font-size="12" fill="#57606a">Hardware-dependent measure</text>
<rect x="342" y="90" width="235" height="105" rx="14" fill="#dafbe1" stroke="#4ac26b"/>
<text x="459" y="125" font-size="17" font-weight="700" fill="#24292f">Generated volume</text>
<text x="459" y="153" font-size="14" fill="#57606a">patient_rows</text>
<text x="459" y="177" font-size="14" fill="#57606a">state_rows</text>
<rect x="629" y="90" width="235" height="105" rx="14" fill="#fff8c5" stroke="#d4a72c"/>
<text x="746" y="125" font-size="17" font-weight="700" fill="#24292f">Lifecycle integrity</text>
<text x="746" y="153" font-size="13" fill="#57606a">arrivals = completed</text>
<text x="746" y="175" font-size="13" fill="#57606a">+ abandoned + unfinished</text>
</g>
<rect x="95" y="230" width="730" height="62" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#24292f">Complete run-level output</text>
<text x="460" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#57606a">outputs/readme_advanced_benchmark.csv</text>
</svg>