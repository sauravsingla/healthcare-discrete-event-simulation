<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
<title id="title">Reproducible benchmark workflow</title>
<desc id="desc">Benchmark configuration flows through deterministic simulation runs to CSV output and documentation assets.</desc>
<rect width="920" height="300" rx="18" fill="#ffffff"/>
<rect x="1" y="1" width="918" height="298" rx="18" fill="none" stroke="#d0d7de"/>
<text x="460" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#24292f">Reproducible Benchmark Workflow</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="55" y="95" width="190" height="105" rx="14" fill="#ddf4ff" stroke="#54aeff"/>
<text x="150" y="127" font-size="17" font-weight="700" fill="#24292f">Scenario grid</text>
<text x="150" y="154" font-size="13" fill="#57606a">Demand: 35, 70, 140</text>
<text x="150" y="176" font-size="13" fill="#57606a">MRI: 1, 2, 4, 8, 12, 20</text>
<rect x="365" y="95" width="190" height="105" rx="14" fill="#dafbe1" stroke="#4ac26b"/>
<text x="460" y="127" font-size="17" font-weight="700" fill="#24292f">Simulation runs</text>
<text x="460" y="154" font-size="13" fill="#57606a">2 replications per scenario</text>
<text x="460" y="176" font-size="13" fill="#57606a">Fixed seed and lifecycle checks</text>
<rect x="675" y="95" width="190" height="105" rx="14" fill="#fff8c5" stroke="#d4a72c"/>
<text x="770" y="127" font-size="17" font-weight="700" fill="#24292f">Recorded outputs</text>
<text x="770" y="154" font-size="13" fill="#57606a">Elapsed seconds</text>
<text x="770" y="176" font-size="13" fill="#57606a">Patient and state rows</text>
</g>
<g stroke="#57606a" stroke-width="3" fill="none">
<line x1="245" y1="148" x2="350" y2="148"/>
<polyline points="338,139 350,148 338,157"/>
<line x1="555" y1="148" x2="660" y2="148"/>
<polyline points="648,139 660,148 648,157"/>
</g>
<rect x="200" y="230" width="520" height="42" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="460" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Run with: python scripts/generate_readme_assets.py</text>
</svg>