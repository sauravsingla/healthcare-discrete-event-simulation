<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare demand and capacity digital twin dashboard preview</title>
  <desc id="desc">A schematic preview showing scenario controls, KPI cards, uncertainty, utilisation and patient performance panels.</desc>
  <rect width="1200" height="650" rx="18" fill="#f6f8fa"/>
  <rect x="22" y="22" width="1156" height="606" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="22" y="22" width="1156" height="66" rx="14" fill="#0f4c5c"/>
  <text x="52" y="63" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Healthcare Demand &amp; Capacity Digital Twin</text>
  <text x="855" y="61" font-family="Arial, sans-serif" font-size="14" fill="#d9f0f4">MRI patient-flow simulation</text>

  <rect x="42" y="108" width="220" height="500" rx="12" fill="#eef5f6" stroke="#c5d9dd"/>
  <text x="62" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#183b43">Scenario controls</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#334e55">
    <text x="62" y="180">Daily MRI demand</text><rect x="62" y="192" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="156" cy="196" r="8" fill="#0f4c5c"/>
    <text x="62" y="235">Operating hours</text><rect x="62" y="247" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="126" cy="251" r="8" fill="#0f4c5c"/>
    <text x="62" y="290">MRI machines</text><rect x="62" y="302" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="143" cy="306" r="8" fill="#0f4c5c"/>
    <text x="62" y="345">Radiographers</text><rect x="62" y="357" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="171" cy="361" r="8" fill="#0f4c5c"/>
    <text x="62" y="400">Radiologists</text><rect x="62" y="412" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="105" cy="416" r="8" fill="#0f4c5c"/>
    <text x="62" y="455">No-show rate</text><rect x="62" y="467" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="112" cy="471" r="8" fill="#0f4c5c"/>
    <text x="62" y="510">Replications</text><rect x="62" y="522" width="175" height="8" rx="4" fill="#b8ccd1"/><circle cx="188" cy="526" r="8" fill="#0f4c5c"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="282" y="108" width="166" height="88" rx="10" fill="#f7fbfc" stroke="#d0d7de"/>
    <text x="299" y="136" font-size="13" fill="#57666a">Mean wait</text><text x="299" y="174" font-size="28" font-weight="700" fill="#0f4c5c">42.6 min</text>
    <rect x="462" y="108" width="166" height="88" rx="10" fill="#f7fbfc" stroke="#d0d7de"/>
    <text x="479" y="136" font-size="13" fill="#57666a">System time</text><text x="479" y="174" font-size="28" font-weight="700" fill="#0f4c5c">89.4 min</text>
    <rect x="642" y="108" width="166" height="88" rx="10" fill="#f7fbfc" stroke="#d0d7de"/>
    <text x="659" y="136" font-size="13" fill="#57666a">Throughput/day</text><text x="659" y="174" font-size="28" font-weight="700" fill="#0f4c5c">66.8</text>
    <rect x="822" y="108" width="166" height="88" rx="10" fill="#f7fbfc" stroke="#d0d7de"/>
    <text x="839" y="136" font-size="13" fill="#57666a">Within 120 min</text><text x="839" y="174" font-size="28" font-weight="700" fill="#0f4c5c">91.2%</text>
    <rect x="1002" y="108" width="156" height="88" rx="10" fill="#f7fbfc" stroke="#d0d7de"/>
    <text x="1019" y="136" font-size="13" fill="#57666a">Completion</text><text x="1019" y="174" font-size="28" font-weight="700" fill="#0f4c5c">97.5%</text>
  </g>

  <rect x="282" y="216" width="428" height="180" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="302" y="247" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#183b43">Replication uncertainty</text>
  <line x1="310" y1="365" x2="680" y2="365" stroke="#b8c4c8"/><line x1="310" y1="270" x2="310" y2="365" stroke="#b8c4c8"/>
  <polyline points="315,342 355,326 395,334 435,304 475,314 515,286 555,299 595,276 635,291 675,266" fill="none" stroke="#0f4c5c" stroke-width="4"/>
  <polyline points="315,351 355,344 395,345 435,335 475,331 515,324 555,321 595,316 635,313 675,309" fill="none" stroke="#7a9e9f" stroke-width="3"/>

  <rect x="730" y="216" width="428" height="180" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="750" y="247" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#183b43">Resource utilisation</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#465a60">
    <text x="752" y="285">Clerks</text><rect x="835" y="273" width="230" height="18" rx="4" fill="#dce8ea"/><rect x="835" y="273" width="145" height="18" rx="4" fill="#0f4c5c"/>
    <text x="752" y="320">Radiographers</text><rect x="835" y="308" width="230" height="18" rx="4" fill="#dce8ea"/><rect x="835" y="308" width="188" height="18" rx="4" fill="#0f4c5c"/>
    <text x="752" y="355">MRI</text><rect x="835" y="343" width="230" height="18" rx="4" fill="#dce8ea"/><rect x="835" y="343" width="204" height="18" rx="4" fill="#0f4c5c"/>
    <text x="752" y="390">Radiologists</text><rect x="835" y="378" width="230" height="18" rx="4" fill="#dce8ea"/><rect x="835" y="378" width="169" height="18" rx="4" fill="#0f4c5c"/>
  </g>

  <rect x="282" y="416" width="876" height="172" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="302" y="447" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#183b43">Patient-type performance and scenario comparison</text>
  <line x1="310" y1="555" x2="1125" y2="555" stroke="#b8c4c8"/>
  <g fill="#0f4c5c"><rect x="350" y="490" width="54" height="65" rx="4"/><rect x="435" y="470" width="54" height="85" rx="4"/><rect x="520" y="452" width="54" height="103" rx="4"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#465a60"><text x="342" y="574">Outpatient</text><text x="430" y="574">Inpatient</text><text x="513" y="574">Emergency</text></g>
  <circle cx="710" cy="520" r="12" fill="#0f4c5c" opacity="0.75"/><circle cx="780" cy="485" r="19" fill="#7a9e9f" opacity="0.75"/><circle cx="870" cy="505" r="15" fill="#3d7d89" opacity="0.75"/><circle cx="965" cy="465" r="23" fill="#5d8f97" opacity="0.75"/><circle cx="1040" cy="525" r="11" fill="#1f6673" opacity="0.75"/>
  <text x="736" y="573" font-family="Arial, sans-serif" font-size="12" fill="#465a60">Wait time →</text>
  <text x="284" y="617" font-family="Arial, sans-serif" font-size="11" fill="#6a737d">Illustrative repository preview; displayed values are schematic, not clinical findings.</text>
</svg>
