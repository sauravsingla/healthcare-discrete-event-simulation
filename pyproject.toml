[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-des"
version = "0.3.0"
description = "Reproducible healthcare demand and capacity modelling with discrete-event simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Saurav Singla"}]
keywords = ["healthcare", "simulation", "simpy", "capacity-planning", "patient-flow", "operations-research", "MRI", "digital-twin", "monte-carlo", "resource-optimisation"]
dependencies = [
  "simpy>=4.1,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.1",
  "build>=1.2,<2",
  "twine>=5,<7",
]
all = ["streamlit>=1.36,<2"]

[project.scripts]
healthcare-des = "healthcare_des.cli:main"
healthcare-des-benchmark = "healthcare_des.benchmark_cli:main"
healthcare-des-reproduce = "healthcare_des.reproduction_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
