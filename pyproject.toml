[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-des"
version = "1.3.0"
description = "Reproducible healthcare demand and capacity modelling with discrete-event simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Saurav Singla"}]
keywords = ["healthcare", "simulation", "simpy", "capacity-planning", "patient-flow", "operations-research", "MRI", "digital-twin", "monte-carlo", "resource-optimisation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "simpy>=4.1,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.urls]
Homepage = "https://github.com/sauravsingla/healthcare-discrete-event-simulation"
Repository = "https://github.com/sauravsingla/healthcare-discrete-event-simulation"
Issues = "https://github.com/sauravsingla/healthcare-discrete-event-simulation/issues"
Documentation = "https://github.com/sauravsingla/healthcare-discrete-event-simulation#readme"
Changelog = "https://github.com/sauravsingla/healthcare-discrete-event-simulation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<0.6",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.1",
  "types-PyYAML>=6.0",
  "Jinja2>=3.1,<4",
  "build>=1.2,<2",
  "twine>=5,<7",
  "pre-commit>=3.7,<5",
]
all = ["streamlit>=1.36,<2"]

[project.scripts]
healthcare-des = "healthcare_des.cli:main"
healthcare-des-benchmark = "healthcare_des.benchmark_cli:main"
healthcare-des-reproduce = "healthcare_des.reproduction_cli:main"
healthcare-des-advanced-benchmark = "healthcare_des.advanced_benchmark_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["healthcare_des"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "healthcare_des.advanced_engine"
disable_error_code = ["assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = [
  "healthcare_des.reporting",
  "healthcare_des.research_validation",
  "healthcare_des.paper_scenarios",
]
disable_error_code = ["arg-type"]
