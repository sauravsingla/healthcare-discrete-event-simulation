[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-des"
version = "0.1.0"
description = "Reproducible healthcare demand and capacity modelling with discrete-event simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Saurav Singla"}]
keywords = ["healthcare", "simulation", "simpy", "capacity-planning", "patient-flow", "operations-research", "MRI", "digital-twin", "monte-carlo", "resource-optimisation"]
dependencies = [
  "simpy>=4.1,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
analysis = ["scipy>=1.11,<2", "matplotlib>=3.8,<4"]
dashboard = ["streamlit>=1.36,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.5,<1"]
all = [
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "streamlit>=1.36,<2",
]

[project.scripts]
healthcare-des = "healthcare_des.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
